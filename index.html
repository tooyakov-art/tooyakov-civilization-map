<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ TOOYAKOV Civilization Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: 100vh;
            cursor: grab;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(251, 191, 36, 0.1) 0%,
                rgba(10, 10, 10, 0.5) 20%,
                rgba(0, 0, 0, 0.9) 50%,
                #000000 100%
            );
        }

        .map-container:active {
            cursor: grabbing;
        }

        .fog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at 50% 50%,
                transparent 15%,
                rgba(0, 0, 0, 0.3) 30%,
                rgba(0, 0, 0, 0.7) 60%,
                rgba(0, 0, 0, 0.95) 100%
            );
            pointer-events: none;
            z-index: 10;
        }

        .expansion-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(251, 191, 36, 0.8);
            font-size: 0.9rem;
            text-align: center;
            z-index: 20;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .civilization-node {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            border: 2px solid;
            z-index: 15;
        }

        .civilization-node::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.1), transparent 70%);
            z-index: -1;
            transition: all 0.4s ease;
        }

        .civilization-node:hover::before {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.2), transparent 70%);
        }

        .player-node {
            background: rgba(251, 191, 36, 0.9);
            border-color: #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
            animation: playerGlow 2s infinite alternate;
        }

        @keyframes playerGlow {
            0% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.6); }
            100% { box-shadow: 0 0 50px rgba(251, 191, 36, 0.9); }
        }

        .explored-node {
            background: rgba(107, 70, 193, 0.3);
            border-color: #6b46c1;
            box-shadow: 0 0 20px rgba(107, 70, 193, 0.4);
        }

        .unexplored-node {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            filter: blur(2px);
            opacity: 0.6;
        }

        .connection {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.8), rgba(251, 191, 36, 0.3));
            transform-origin: left center;
            z-index: 5;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .connection.unexplored {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0.3;
        }

        .connection:hover {
            height: 4px;
            opacity: 1;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .info-panel {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 300px;
            z-index: 20;
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .info-panel.active {
            transform: translateX(0);
        }

        .info-title {
            font-size: 1.2rem;
            color: #fbbf24;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-description {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .expansion-progress {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .expansion-fill {
            background: linear-gradient(90deg, #fbbf24, #6b46c1);
            height: 100%;
            transition: width 1s ease;
        }

        .controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 20;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .minimap {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 150px;
            height: 100px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 8px;
            z-index: 20;
            overflow: hidden;
        }

        .minimap-viewport {
            position: absolute;
            border: 2px solid #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .info-panel {
                top: 1rem;
                left: 1rem;
                right: 1rem;
                max-width: none;
            }
            .controls {
                bottom: 1rem;
                right: 1rem;
            }
            .minimap {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="map-container" id="mapContainer">
        <!-- Fog of War -->
        <div class="fog-overlay"></div>
        
        <!-- Expansion Hint -->
        <div class="expansion-hint">
            🌟 Исследуй неизведанные территории власти<br>
            <small>Нажми на узлы для расширения империи</small>
        </div>

        <!-- Player Node (Center) -->
        <div class="civilization-node player-node" 
             style="top: 50%; left: 50%; transform: translate(-50%, -50%)" 
             data-type="player">
            👑
        </div>

        <!-- Info Panel -->
        <div class="info-panel" id="infoPanel">
            <div class="info-title" id="infoTitle">
                <span id="infoEmoji">👑</span>
                <span id="infoName">TOOYAKOV Empire</span>
            </div>
            <div class="info-description" id="infoDescription">
                Твоя начальная позиция. Отсюда начинается завоевание цифрового мира.
            </div>
            <div class="expansion-progress">
                <div class="expansion-fill" id="expansionFill" style="width: 15%"></div>
            </div>
            <small>Прогресс экспансии: <span id="progressText">15%</span></small>
        </div>

        <!-- Minimap -->
        <div class="minimap">
            <div class="minimap-viewport" id="minimapViewport"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-btn" onclick="resetView()" title="Центр">🎯</div>
            <div class="control-btn" onclick="zoomIn()" title="Приблизить">+</div>
            <div class="control-btn" onclick="zoomOut()" title="Отдалить">-</div>
        </div>
    </div>

    <script>
        const nodes = [
            // Player
            { id: 'player', emoji: '👑', name: 'TOOYAKOV Empire', type: 'player', x: 0, y: 0, 
              description: 'Твоя начальная позиция. Отсюда начинается завоевание цифрового мира.' },
            
            // Explored territories
            { id: 'capital', emoji: '💰', name: 'Капитал', type: 'explored', x: -120, y: -80,
              description: 'Финансовая основа империи. Без капитала нет экспансии.' },
            { id: 'tech', emoji: '🛠️', name: 'Технологии', type: 'explored', x: 150, y: -100,
              description: 'Технологическое превосходство. React, AI, Blockchain.' },
            { id: 'mobile', emoji: '📱', name: 'Mobile Apps', type: 'explored', x: 200, y: 50,
              description: 'Мобильная империя. 4.5M пользователей.' },
            
            // Partially explored
            { id: 'design', emoji: '🎨', name: 'Premium Design', type: 'explored', x: -100, y: 120,
              description: 'Дизайн-философия TOOYAKOV. Blur effects и glass morphism.' },
            { id: 'business', emoji: '💼', name: 'Бизнес', type: 'explored', x: 80, y: 140,
              description: 'Стратегия роста. High-value клиенты и revenue streams.' },
            
            // Unexplored territories (темнота)
            { id: 'ai-future', emoji: '🤖', name: 'AI Empire', type: 'unexplored', x: 300, y: -50,
              description: 'Будущее искусственного интеллекта. Неизведанная территория.' },
            { id: 'crypto', emoji: '⚡', name: 'Crypto World', type: 'unexplored', x: -250, y: -120,
              description: 'Криптовалютная экспансия. Огромный потенциал.' },
            { id: 'metaverse', emoji: '🌐', name: 'Metaverse', type: 'unexplored', x: -180, y: 200,
              description: 'Виртуальная реальность. Следующий фронтир.' },
            { id: 'global', emoji: '🌍', name: 'Global Scale', type: 'unexplored', x: 250, y: 180,
              description: 'Мировое доминирование. Конечная цель.' }
        ];

        const connections = [
            ['player', 'capital'], ['player', 'tech'], ['player', 'design'],
            ['capital', 'crypto'], ['tech', 'mobile'], ['tech', 'ai-future'],
            ['mobile', 'global'], ['design', 'metaverse'], ['business', 'global']
        ];

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let lastPanPoint = null;

        function initializeMap() {
            const container = document.getElementById('mapContainer');
            
            // Create connections first (behind nodes)
            connections.forEach(([from, to]) => {
                const fromNode = nodes.find(n => n.id === from);
                const toNode = nodes.find(n => n.id === to);
                
                if (fromNode && toNode) {
                    createConnection(fromNode, toNode);
                }
            });

            // Create nodes
            nodes.forEach(node => {
                if (node.id !== 'player') { // Player node already exists
                    createNode(node);
                }
            });

            // Setup pan and zoom
            setupControls();
            
            // Show info panel
            setTimeout(() => {
                document.getElementById('infoPanel').classList.add('active');
            }, 1000);
        }

        function createNode(node) {
            const container = document.getElementById('mapContainer');
            const nodeEl = document.createElement('div');
            nodeEl.className = `civilization-node ${node.type}-node`;
            nodeEl.style.left = `calc(50% + ${node.x}px)`;
            nodeEl.style.top = `calc(50% + ${node.y}px)`;
            nodeEl.style.transform = 'translate(-50%, -50%)';
            nodeEl.textContent = node.emoji;
            nodeEl.dataset.type = node.type;
            nodeEl.dataset.id = node.id;
            
            nodeEl.onclick = () => showNodeInfo(node);
            
            if (node.type === 'unexplored') {
                nodeEl.onclick = () => exploreNode(node, nodeEl);
            }
            
            container.appendChild(nodeEl);
        }

        function createConnection(fromNode, toNode) {
            const container = document.getElementById('mapContainer');
            const line = document.createElement('div');
            line.className = `connection ${toNode.type === 'unexplored' ? 'unexplored' : ''}`;
            
            const deltaX = toNode.x - fromNode.x;
            const deltaY = toNode.y - fromNode.y;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI;
            
            line.style.left = `calc(50% + ${fromNode.x}px)`;
            line.style.top = `calc(50% + ${fromNode.y}px)`;
            line.style.width = `${distance}px`;
            line.style.transform = `rotate(${angle}deg)`;
            
            container.appendChild(line);
        }

        function showNodeInfo(node) {
            document.getElementById('infoEmoji').textContent = node.emoji;
            document.getElementById('infoName').textContent = node.name;
            document.getElementById('infoDescription').textContent = node.description;
            
            if (node.type === 'unexplored') {
                document.getElementById('infoDescription').innerHTML = 
                    node.description + '<br><br><small style="color: #fbbf24;">Нажми для исследования</small>';
            }
        }

        function exploreNode(node, nodeEl) {
            // Animate exploration
            nodeEl.style.filter = 'blur(0px)';
            nodeEl.style.opacity = '1';
            nodeEl.className = nodeEl.className.replace('unexplored-node', 'explored-node');
            
            // Update progress
            const explored = document.querySelectorAll('.explored-node').length;
            const total = nodes.length;
            const progress = Math.round((explored / total) * 100);
            
            document.getElementById('expansionFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${progress}%`;
            
            // Update node data
            node.type = 'explored';
            showNodeInfo(node);
            
            // Visual feedback
            nodeEl.style.transform += ' scale(1.2)';
            setTimeout(() => {
                nodeEl.style.transform = nodeEl.style.transform.replace(' scale(1.2)', '');
            }, 300);
        }

        function setupControls() {
            const container = document.getElementById('mapContainer');
            
            container.addEventListener('mousedown', startPan);
            container.addEventListener('mousemove', pan);
            container.addEventListener('mouseup', endPan);
            container.addEventListener('mouseleave', endPan);
            
            // Touch events
            container.addEventListener('touchstart', startPan);
            container.addEventListener('touchmove', pan);
            container.addEventListener('touchend', endPan);
            
            // Wheel zoom
            container.addEventListener('wheel', zoom);
        }

        function startPan(e) {
            isPanning = true;
            lastPanPoint = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
            document.getElementById('mapContainer').style.cursor = 'grabbing';
        }

        function pan(e) {
            if (!isPanning || !lastPanPoint) return;
            
            e.preventDefault();
            const currentPoint = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
            
            panX += currentPoint.x - lastPanPoint.x;
            panY += currentPoint.y - lastPanPoint.y;
            
            updateTransform();
            lastPanPoint = currentPoint;
        }

        function endPan() {
            isPanning = false;
            lastPanPoint = null;
            document.getElementById('mapContainer').style.cursor = 'grab';
        }

        function zoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.max(0.5, Math.min(3, scale * delta));
            updateTransform();
        }

        function zoomIn() {
            scale = Math.min(3, scale * 1.2);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(0.5, scale * 0.8);
            updateTransform();
        }

        function resetView() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function updateTransform() {
            const container = document.getElementById('mapContainer');
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // Initialize on load
        initializeMap();
        
        // Show initial node info
        setTimeout(() => {
            showNodeInfo(nodes.find(n => n.id === 'player'));
        }, 500);

        console.log('🗺️ TOOYAKOV Civilization Map loaded');
        console.log('👑 Начинай экспансию империи!');
    </script>
</body>
</html>
