<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ TOOYAKOV Empire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        .app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(251, 191, 36, 0.15) 0%,
                rgba(10, 10, 10, 0.7) 25%,
                rgba(0, 0, 0, 0.9) 60%,
                #000000 100%
            );
        }

        .map-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        .map-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease;
        }

        .fog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(
                circle at 50% 50%,
                transparent 20%,
                rgba(0, 0, 0, 0.4) 40%,
                rgba(0, 0, 0, 0.8) 70%,
                rgba(0, 0, 0, 0.95) 100%
            );
            pointer-events: none;
            z-index: 50;
        }

        .territory {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(8px);
            border: 2px solid;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        .territory::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, currentColor, transparent 60%);
            opacity: 0.1;
            z-index: -1;
            transition: all 0.4s ease;
        }

        .territory:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .territory.player {
            background: rgba(251, 191, 36, 0.9);
            border-color: #fbbf24;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
            animation: playerPulse 2s infinite alternate;
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
        }

        @keyframes playerPulse {
            0% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.6); }
            100% { box-shadow: 0 0 35px rgba(251, 191, 36, 0.8); }
        }

        .territory.conquered {
            background: rgba(107, 70, 193, 0.4);
            border-color: #6b46c1;
            box-shadow: 0 0 15px rgba(107, 70, 193, 0.4);
        }

        .territory.unexplored {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            filter: blur(1px);
            opacity: 0.7;
        }

        .territory:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .territory.unexplored:hover {
            filter: blur(0px);
            opacity: 1;
        }

        .connection {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.6), rgba(251, 191, 36, 0.2));
            transform-origin: left center;
            z-index: 5;
            pointer-events: none;
        }

        .connection.unexplored {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0.4;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(251, 191, 36, 0.3);
            padding: 0.8rem 1rem;
            text-align: center;
            pointer-events: auto;
        }

        .empire-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fbbf24, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(251, 191, 36, 0.3);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .stat {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fbbf24;
        }

        .stat-label {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 0.1rem;
        }

        .info-panel {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 1rem;
            max-width: 280px;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(-50%) translateX(-100%);
            transition: all 0.4s ease;
        }

        .info-panel.active {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .info-emoji {
            font-size: 2rem;
        }

        .info-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fbbf24;
        }

        .info-desc {
            font-size: 0.85rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
        }

        .conquest-btn {
            width: 100%;
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 8px;
            padding: 0.6rem;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .conquest-btn:active {
            transform: scale(0.95);
        }

        .close-panel {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            position: absolute;
            bottom: 5rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            pointer-events: auto;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .expansion-hint {
            position: absolute;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(251, 191, 36, 0.8);
            font-size: 0.8rem;
            text-align: center;
            animation: fadeInOut 4s infinite;
            pointer-events: auto;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 480px) {
            .territory {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }

            .territory.player {
                width: 52px;
                height: 52px;
                font-size: 1.6rem;
            }

            .info-panel {
                left: 0.5rem;
                right: 0.5rem;
                max-width: none;
                top: auto;
                bottom: 6rem;
                transform: translateY(100%);
            }

            .info-panel.active {
                transform: translateY(0);
            }

            .stats-bar {
                padding: 0.6rem 0.8rem;
            }

            .stat-value {
                font-size: 1rem;
            }

            .stat-label {
                font-size: 0.65rem;
            }

            .expansion-hint {
                font-size: 0.75rem;
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="map-viewport" id="viewport">
            <div class="map-container" id="mapContainer">
                <!-- Territories will be added here -->
            </div>
            <div class="fog-overlay"></div>
        </div>

        <div class="ui-overlay">
            <div class="header">
                <div class="empire-title">🗺️ TOOYAKOV Empire</div>
            </div>

            <div class="info-panel" id="infoPanel">
                <button class="close-panel" onclick="closeInfo()">×</button>
                <div class="info-header">
                    <div class="info-emoji" id="infoEmoji">👑</div>
                    <div class="info-title" id="infoTitle">Empire Center</div>
                </div>
                <div class="info-desc" id="infoDesc">Твой центр власти. Отсюда начинается экспансия.</div>
                <button class="conquest-btn" id="conquestBtn" onclick="conquerTerritory()">
                    Завоевать
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="territories">1</div>
                    <div class="stat-label">Территории</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="power">100</div>
                    <div class="stat-label">Власть</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="progress">5%</div>
                    <div class="stat-label">Прогресс</div>
                </div>
            </div>

            <div class="expansion-hint">
                Нажми на туманные территории для экспансии
            </div>

            <div class="controls">
                <div class="control-btn" onclick="resetView()">🎯</div>
                <div class="control-btn" onclick="zoomIn()">+</div>
                <div class="control-btn" onclick="zoomOut()">-</div>
            </div>
        </div>
    </div>

    <script>
        const territories = [
            { id: 'player', emoji: '👑', name: 'TOOYAKOV Empire', type: 'player', x: 0, y: 0, 
              desc: 'Твой центр власти. Отсюда начинается экспансия.' },
            { id: 'capital', emoji: '💰', name: 'Капитал', type: 'conquered', x: -100, y: -60,
              desc: 'Финансовая мощь. Основа экономического доминирования.' },
            { id: 'tech', emoji: '🛠️', name: 'Технологии', type: 'conquered', x: 120, y: -80,
              desc: 'Цифровое превосходство. React, AI, Blockchain.' },
            { id: 'mobile', emoji: '📱', name: 'Mobile', type: 'conquered', x: 150, y: 40,
              desc: 'Мобильная империя с миллионами пользователей.' },
            { id: 'design', emoji: '🎨', name: 'Design', type: 'conquered', x: -80, y: 100,
              desc: 'Премиум эстетика TOOYAKOV.' },
            
            // Unexplored
            { id: 'ai', emoji: '🤖', name: 'AI Future', type: 'unexplored', x: 200, y: -40,
              desc: 'Искусственный интеллект. Безграничные возможности.' },
            { id: 'crypto', emoji: '⚡', name: 'Crypto', type: 'unexplored', x: -180, y: -80,
              desc: 'Криптовалютное доминирование.' },
            { id: 'metaverse', emoji: '🌐', name: 'Metaverse', type: 'unexplored', x: -120, y: 150,
              desc: 'Виртуальные миры под твоим контролем.' },
            { id: 'global', emoji: '🌍', name: 'Global', type: 'unexplored', x: 180, y: 120,
              desc: 'Планетарное влияние.' }
        ];

        const connections = [
            ['player', 'capital'], ['player', 'tech'], ['player', 'design'], ['player', 'mobile'],
            ['capital', 'crypto'], ['tech', 'ai'], ['design', 'metaverse'], ['mobile', 'global']
        ];

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let selectedTerritory = null;
        let conqueredCount = 5;

        class TouchHandler {
            constructor(element) {
                this.element = element;
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.startDistance = 0;
                this.startScale = 1;
                this.lastTouchTime = 0;

                this.setupEvents();
            }

            setupEvents() {
                this.element.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: false });
                this.element.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
                this.element.addEventListener('touchend', this.onTouchEnd.bind(this), { passive: false });

                // Mouse events for desktop
                this.element.addEventListener('mousedown', this.onMouseDown.bind(this));
                this.element.addEventListener('mousemove', this.onMouseMove.bind(this));
                this.element.addEventListener('mouseup', this.onMouseUp.bind(this));
                this.element.addEventListener('wheel', this.onWheel.bind(this), { passive: false });
            }

            onTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;

                if (touches.length === 1) {
                    this.isDragging = true;
                    this.startX = touches[0].clientX - panX;
                    this.startY = touches[0].clientY - panY;
                } else if (touches.length === 2) {
                    this.startDistance = this.getDistance(touches[0], touches[1]);
                    this.startScale = scale;
                }
            }

            onTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;

                if (touches.length === 1 && this.isDragging) {
                    panX = touches[0].clientX - this.startX;
                    panY = touches[0].clientY - this.startY;
                    updateTransform();
                } else if (touches.length === 2) {
                    const distance = this.getDistance(touches[0], touches[1]);
                    const scaleChange = distance / this.startDistance;
                    scale = Math.max(0.5, Math.min(3, this.startScale * scaleChange));
                    updateTransform();
                }
            }

            onTouchEnd(e) {
                this.isDragging = false;
            }

            onMouseDown(e) {
                this.isDragging = true;
                this.startX = e.clientX - panX;
                this.startY = e.clientY - panY;
            }

            onMouseMove(e) {
                if (!this.isDragging) return;
                panX = e.clientX - this.startX;
                panY = e.clientY - this.startY;
                updateTransform();
            }

            onMouseUp(e) {
                this.isDragging = false;
            }

            onWheel(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.max(0.5, Math.min(3, scale * delta));
                updateTransform();
            }

            getDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
        }

        function updateTransform() {
            const container = document.getElementById('mapContainer');
            container.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`;
        }

        function createTerritories() {
            const container = document.getElementById('mapContainer');

            // Create connections first
            connections.forEach(([from, to]) => {
                const fromTerr = territories.find(t => t.id === from);
                const toTerr = territories.find(t => t.id === to);
                
                if (fromTerr && toTerr) {
                    const line = document.createElement('div');
                    line.className = `connection ${toTerr.type === 'unexplored' ? 'unexplored' : ''}`;
                    
                    const deltaX = toTerr.x - fromTerr.x;
                    const deltaY = toTerr.y - fromTerr.y;
                    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                    const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI;
                    
                    line.style.left = `${fromTerr.x}px`;
                    line.style.top = `${fromTerr.y}px`;
                    line.style.width = `${distance}px`;
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    container.appendChild(line);
                }
            });

            // Create territories
            territories.forEach(territory => {
                const el = document.createElement('div');
                el.className = `territory ${territory.type}`;
                el.style.left = `${territory.x}px`;
                el.style.top = `${territory.y}px`;
                el.textContent = territory.emoji;
                el.dataset.id = territory.id;
                
                el.onclick = () => showInfo(territory);
                
                container.appendChild(el);
            });
        }

        function showInfo(territory) {
            selectedTerritory = territory;
            
            document.getElementById('infoEmoji').textContent = territory.emoji;
            document.getElementById('infoTitle').textContent = territory.name;
            document.getElementById('infoDesc').textContent = territory.desc;
            
            const btn = document.getElementById('conquestBtn');
            if (territory.type === 'unexplored') {
                btn.textContent = 'Завоевать';
                btn.style.display = 'block';
            } else if (territory.type === 'player') {
                btn.style.display = 'none';
            } else {
                btn.textContent = 'Захвачено';
                btn.disabled = true;
                btn.style.opacity = '0.5';
            }
            
            document.getElementById('infoPanel').classList.add('active');
        }

        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('active');
        }

        function conquerTerritory() {
            if (!selectedTerritory || selectedTerritory.type !== 'unexplored') return;
            
            selectedTerritory.type = 'conquered';
            conqueredCount++;
            
            // Update UI
            const element = document.querySelector(`[data-id="${selectedTerritory.id}"]`);
            element.className = 'territory conquered';
            
            updateStats();
            closeInfo();
        }

        function updateStats() {
            const progress = Math.round((conqueredCount / territories.length) * 100);
            const power = conqueredCount * 150;
            
            document.getElementById('territories').textContent = conqueredCount;
            document.getElementById('power').textContent = power;
            document.getElementById('progress').textContent = `${progress}%`;
        }

        function resetView() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function zoomIn() {
            scale = Math.min(3, scale * 1.3);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(0.5, scale * 0.7);
            updateTransform();
        }

        // Initialize
        createTerritories();
        updateStats();
        new TouchHandler(document.getElementById('viewport'));

        // Auto-show player info
        setTimeout(() => {
            showInfo(territories.find(t => t.id === 'player'));
        }, 1000);

        console.log('🗺️ TOOYAKOV Empire готова к завоеваниям!');
    </script>
</body>
</html>
